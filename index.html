<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>昆虫世界 — 像博物学家一样认识昆虫</title>
    <meta name="description" content="可交互的 3D 昆虫图鉴：旋转、缩放、点击标注点，认识每一种昆虫的身体构造与生活史。" />
    <meta name="theme-color" content="#faf3e7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 分享卡片：微信/QQ/Twitter 抓的都是这几行；og:image 必须是绝对地址 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="昆虫世界 — 3D 昆虫图鉴" />
    <meta property="og:description" content="50 种昆虫的可交互 3D 标本：旋转、剖切、点击标注点，认识身体构造与生活史。" />
    <meta property="og:url" content="https://insect-world.pages.dev/" />
    <meta property="og:image" content="https://insect-world.pages.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      字体样式表必须异步加载（media="print" 先旁路渲染，onload 再切回 all）。

      原先是普通的 <link rel="stylesheet">，属于渲染阻塞资源 —— 而
      fonts.googleapis.com 在中国大陆无法访问，访客的浏览器会卡在这一行
      等到超时才肯画第一屏，白屏可达几十秒。字体是锦上添花，
      global.css 里每个字体族都排了系统字体兜底，拿不到就用兜底，
      不能让它挡住整个站。
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Serif+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Serif+SC:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
