# 每次 push 与 PR 都跑一遍类型检查、全量测试与生产构建。
#
# 为什么三步都要：
# - vitest **不做类型检查**（它只转译），所以 tsc 必须单独跑一次 ——
#   曾有一个不存在的触角类型字符串一路绿灯到构建才被发现。
# - 构建单独跑一次是因为 vite 的产物层还有 tsc 管不到的东西
#   （glob 注册、chunk 切分），本地 `npm test` 全绿而构建挂掉是可能的。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # 允许在 Actions 页手动触发一次

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 ci 而非 install：严格按 lockfile 装，锁不上就直接失败，
      # 免得 CI 悄悄装了跟本地不同的版本
      #
      # playwright 现在写进了 devDependencies（在此之前它被 8 个截图脚本用着
      # 却没声明 —— node_modules 被清空一次就全废了）。但它的 postinstall 会
      # 下载几百 MB 浏览器，而 CI 只跑 typecheck/test/build，一个都用不上，
      # 所以显式跳过。要在 CI 里跑截图脚本时，再单独 `npx playwright install`。
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: 类型检查
        run: npm run typecheck

      - name: 全量测试
        run: npm test

      - name: 生产构建
        run: npm run build
